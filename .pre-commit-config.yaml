# Git hooks for everyone who clones this repository, managed by pre-commit (https://pre-commit.com).
# One-time setup per clone:
#   pipx install pre-commit        (or: uv tool install pre-commit / pip install pre-commit)
#   pre-commit install --hook-type pre-commit --hook-type pre-push
# Run every hook against the whole repository:  pre-commit run --all-files
# Update hook versions:                         pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks        # blocks commits that contain secrets; pre-commit builds gitleaks itself
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
